name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the checkers (pillow for contact_sheet's import)
        run: pip install mypy pyflakes pillow

      - name: Every function follows the kShared error pattern
        run: python kpy/check_kpattern.py
      - name: Generated copies match the masters and are not hand-edited
        run: python kpy/kPyCompiler.py --manifest kpy.manifest.json --action verify
      - name: Type check the masters (mypy.ini)
        run: mypy
      - name: pyflakes on the masters and tests (generated copies skipped)
        run: python -m pyflakes $(grep -rL --include='*.py' '^# GENERATED by kPyCompiler' kshared kpy powerpoint gemini veo vedit)

      - name: Tests - kshared
        run: python -m unittest discover -s kshared/tests -v
      - name: Tests - kpy
        run: python -m unittest discover -s kpy/tests -v
      - name: Tests - powerpoint (the COM tests skip without pywin32 and PowerPoint)
        run: python -m unittest discover -s powerpoint/tests -v
