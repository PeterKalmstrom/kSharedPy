name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the checkers (pillow for contact_sheet's import)
        run: pip install mypy pyflakes pillow

      - name: Every function follows the kShared error pattern
        run: python kpy/check_kpattern.py
      - name: Generated copies match the masters and are not hand-edited
        run: python kpy/kPyCompiler.py --manifest kpy.manifest.json --action verify
      - name: Type check the masters (mypy.ini)
        run: mypy
      - name: pyflakes on the masters and tests (generated copies skipped)
        run: python -m pyflakes $(grep -rL --include='*.py' '^# GENERATED by kPyCompiler' kshared kpy powerpoint gemini veo vedit)

      - name: Install the test dependencies (python-pptx and pillow; ffmpeg for the vedit/veo media tests; Carlito and Liberation for the _measure metric-twin tests)
        run: |
          pip install python-pptx pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-crosextra-carlito fonts-liberation2

      - name: Tests - kshared
        run: python -m unittest discover -s kshared/tests -v
      - name: Tests - kpy
        run: python -m unittest discover -s kpy/tests -v
      - name: Tests - powerpoint (the COM tests skip without pywin32 and PowerPoint)
        run: python -m unittest discover -s powerpoint/tests -v
      - name: Tests - vedit (scripts as child processes; fake google.genai, no network)
        run: python -m unittest discover -s vedit/tests -v
      - name: Tests - gemini (fake google.genai, no network, no key)
        run: python -m unittest discover -s gemini/tests -v
      - name: Tests - veo (fake google.genai, no network, no key)
        run: python -m unittest discover -s veo/tests -v

  pep723-headers:
    # Every runnable master script resolves its own PEP 723 dependency header and runs --help (uv run).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
      - name: uv run <script> --help for every script with a header
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for f in $(grep -lE '^# /// script' gemini/*.py veo/*.py vedit/*.py powerpoint/*.py kpy/*.py); do
            if head -n1 "$f" | grep -q '^# GENERATED by kPyCompiler'; then continue; fi
            echo "::group::uv run $f --help"
            if ! uv run --no-progress "$f" --help; then echo "::error file=$f::uv run --help failed"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
