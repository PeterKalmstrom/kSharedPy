# mypy for the kSharedPy masters. Run from the repo root: mypy
#
# Every script folder holds generated copies of the kshared masters (powerpoint/kShared.py, vedit/kGenAi.py ...).
# They are excluded, and mypy_path makes "import kShared" resolve to the master in kshared/, so each module name
# exists once. kpy, powerpoint and vedit are on the path too, for the sibling imports check_kpattern, _ppt and
# _transcript. explicit_package_bases names each file relative to those folders (kshared/kShared.py -> kShared).
[mypy]
python_version = 3.10
files = kshared, kpy, powerpoint, gemini, veo, vedit
mypy_path = kshared:kpy:powerpoint:vedit
explicit_package_bases = True
namespace_packages = True
exclude = (?x)(
    ^_scratch/
    | /tests/
    | /__init__\.py$
    | ^(powerpoint|gemini|veo|vedit)/(kShared|send_error_report|kGenAi|kJsonFile|kFfmpeg)\.py$
  )
warn_unused_ignores = True
warn_redundant_casts = True
check_untyped_defs = True

[mypy-win32com.*,pythoncom,pywintypes,google,google.*,static_ffmpeg,static_ffmpeg.*,faster_whisper,faster_whisper.*,silero_vad,silero_vad.*,PIL,PIL.*,pptx,pptx.*]
ignore_missing_imports = True
